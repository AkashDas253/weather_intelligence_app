resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"

      # Runs daily at 6:00 AM UTC
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: single_node_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 0
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*]"
            custom_tags:
              "ResourceClass": "SingleNode"
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: ingest_weather_embeddings
          job_cluster_key: single_node_cluster
          libraries:
            - pypi:
                package: "psycopg2-binary"
            - pypi:
                package: "sentence-transformers"
            - pypi:
                package: "pgvector"
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              documents_table_name: "weather.weather_documents"
              chunk_embeddings_table_name: "weather.weather_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              chunk_size: "800"
              chunk_overlap: "100"